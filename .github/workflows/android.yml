name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      # The core resolves from JitPack (settings.gradle.kts); no sibling checkout needed.
      - run: ./gradlew testDebugUnitTest assembleRelease :sample:assembleDebug --no-daemon
